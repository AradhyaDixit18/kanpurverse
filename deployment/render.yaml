# Render.com blueprint (free web service; note: free instances sleep after idle — see docs/VERCEL_DEPLOYMENT_REPORT.md)
services:
  - type: web
    name: kanpurverse-server
    runtime: docker
    dockerfilePath: ./deployment/Dockerfile.server
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://kanpurverse.vercel.app,https://*.vercel.app
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: kanpurverse
