<!doctype html><meta charset="utf-8"><title>Save review proof</title><label>Review screenshot data<textarea aria-label="Review screenshot data" id="data"></textarea></label><button id="save">Save review screenshot</button><output id="result"></output><script>document.querySelector('#save').onclick=async()=>{const r=await fetch('/save-proof',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:document.querySelector('#data').value})});document.querySelector('#result').textContent=await r.text();};</script>
