name: Visual + multiplayer smoke (headless Chromium)
on:
  workflow_dispatch:
jobs:
  visual:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm i -D playwright@1.49.1 --no-save && npx playwright install --with-deps chromium
      - run: npm run build -w apps/web
        env: { NEXT_TELEMETRY_DISABLED: 1, NEXT_PUBLIC_QA: "1", NEXT_PUBLIC_WS_URL: "ws://localhost:8787" }
      - run: node tests/visual/run.mjs || true
      - uses: actions/upload-artifact@v4
        with: { name: screenshots, path: docs/screenshots }
      - name: Commit screenshots
        run: |
          git config user.name "kanpurverse-bot"; git config user.email "actions@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet || git commit -m "qa: headless visual + multiplayer smoke screenshots [skip ci]"
          git pull --rebase origin main && git push
