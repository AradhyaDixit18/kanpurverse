name: Fetch Kanpur OSM data + CC0 assets
# Manual. Runs the geospatial pipeline (OpenStreetMap via Overpass, ODbL) and downloads CC0 textures/HDRIs, then commits them.
on:
  workflow_dispatch:
    inputs:
      what:
        description: "geo | assets | both"
        default: "both"
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: OSM geospatial pipeline
        if: ${{ inputs.what != 'assets' }}
        run: python3 scripts/geo/fetch_kanpur_osm.py
      - name: CC0 textures + HDRIs
        if: ${{ inputs.what != 'geo' }}
        run: bash scripts/assets/fetch_cc0_assets.sh
      - name: Commit
        run: |
          git config user.name "kanpurverse-bot"; git config user.email "actions@users.noreply.github.com"
          git add apps/web/public/geo apps/web/public/tex apps/web/public/hdr docs/geo_provenance.json
          git diff --cached --quiet || git commit -m "data: Kanpur OSM extract (ODbL) + CC0 textures/HDRIs"
          git pull --rebase origin main && git push
